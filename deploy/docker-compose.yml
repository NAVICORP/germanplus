# German Plus on one server: Postgres, the German Plus API, and the site in front of
# it. Deployed with Dokploy from this repository (GitHub provider, compose path
# ./deploy/docker-compose.yml), which builds the image on the server itself:
# no registry login needed. The domain germanplus.skifi.co goes to service
# `site`, port 8000. Each push to main redeploys it.
#
# Passwords: the first start creates random ones inside the `secrets` volume.
# Sign-in (WhatsApp, Google, email codes) is SkAuth at account.skifi.co. Nothing to paste.

services:
  secrets:
    image: alpine:3.22
    restart: "no"
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -e
        for f in db_password authenticator_password jwt_secret; do
          if [ ! -s /secrets/$$f ]; then
            head -c 48 /dev/urandom | base64 | tr -d '\n/+=' > /secrets/$$f
          fi
        done
        chmod 644 /secrets/*

  db:
    image: ghcr.io/navicorp/farmi-life-db:latest
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: germanplus
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
      - backups:/backups
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d germanplus"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The database API, sign-in (passed on to SkAuth) and the 3K save function.
  # The site reaches it as `germanplus-api`: plain `api` is also the name of
  # other apps' services on Dokploy's shared network, where the site sits too.
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: germanplus-api:latest
    pull_policy: build
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: germanplus
      API_URL: https://germanplus.skifi.co
      SITE_URL: https://germanplus.skifi.co
      AUTH_MODE: app
      AUTH_PROVIDER_URL: https://account.skifi.co
      APP_ID: germanplus
      WEB_DIR: ""
    volumes:
      - secrets:/secrets:ro
    networks:
      default:
        aliases:
          - germanplus-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # The pages, the live catalogue, product photos, and the door to the API.
  site:
    build:
      context: ..
      dockerfile: Dockerfile
    image: germanplus-site:latest
    pull_policy: build
    restart: unless-stopped
    command: ["node", "/srv/site/server/site.mjs"]
    expose:
      - "8000"
    environment:
      API_INTERNAL: http://germanplus-api:8000
      # The public address, and the address the admin and its sign in live on.
      SITE_URL: https://germanplusgh.com
      ADMIN_URL: https://germanplus.skifi.co
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # A database copy every night at 03:00 server time, the last 30 kept.
  backup:
    image: ghcr.io/navicorp/farmi-life-db:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - secrets:/secrets:ro
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        export PGPASSWORD="$$(cat /secrets/db_password)"
        while true; do
          now=$$(date +%H%M)
          if [ "$$now" = "0300" ]; then
            f=/backups/germanplus-$$(date +%Y%m%d-%H%M).dump
            pg_dump -h db -U postgres -d germanplus -Fc -f "$$f.part" && mv "$$f.part" "$$f" && echo "backup $$f"
            ls -1t /backups/germanplus-*.dump 2>/dev/null | tail -n +31 | xargs -r rm -f
            sleep 61
          fi
          sleep 30
        done

# Fixed names, so the data never depends on what Dokploy calls the project.
volumes:
  pgdata:
    name: germanplus_pgdata
  secrets:
    name: germanplus_secrets
  backups:
    name: germanplus_backups
